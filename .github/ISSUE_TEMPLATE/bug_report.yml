name: Bug report
description: A plugin middleware behaves incorrectly.
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [docker, dotnet, git, github, gitlab, moonlit, nodejs, semantic-release, slack]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The tag in your plugin URL, e.g. 0.1.0.
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: moonlit --version
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Pipeline excerpt
      description: The plugin entry and the failing step. Remove secrets.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the step's log output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
