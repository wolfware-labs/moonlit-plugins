version: 2
updates:
  # Dependabot's "include: scope" would emit "deps-dev" for development
  # dependencies, which the PR guard rejects. Writing the scope into the prefix
  # (and leaving "include" unset) keeps every title as "<type>(deps): ...".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps)
    groups:
      cargo-compatible:
        update-types: [minor, patch]
