[package]
name = "moonlit-plugin-git"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Moonlit first-party git plugin."

[lib]
name = "git"
crate-type = ["cdylib"]

[dependencies]
moonlit-sdk = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
moonlit-engine = { git = "https://github.com/wolfware-labs/moonlit", rev = "db48c373f6f73a30378219a94eb7174f66cc99a6" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
