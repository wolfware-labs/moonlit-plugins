[package]
name = "moonlit-plugin-semantic-release"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Moonlit first-party semantic-release plugin."

[lib]
name = "semantic_release"
crate-type = ["cdylib"]

[dependencies]
moonlit-sdk = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
regex = "1"
semver = "1"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
moonlit-engine = { git = "https://github.com/wolfware-labs/moonlit", rev = "eb52466a659015335d3e2fa9286db7b29e820927" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[features]
cli-e2e = []
